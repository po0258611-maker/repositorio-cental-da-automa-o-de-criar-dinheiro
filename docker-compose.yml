services:
  ame:
    build: .
    container_name: ame-core
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ame_data:/app/data
      - ./exports:/app/exports
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    image: python:3.11-slim
    container_name: ame-dashboard-legacy
    working_dir: /app
    command: bash -c "pip install -q fastapi uvicorn && python dashboard/app.py"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./:/app:ro
    restart: unless-stopped
    profiles: ["legacy"]

  n8n:
    image: n8nio/n8n:latest
    container_name: ame-n8n
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "${N8N_BASIC_AUTH_USER:?Set N8N_BASIC_AUTH_USER in .env}"
      N8N_BASIC_AUTH_PASSWORD: "${N8N_BASIC_AUTH_PASSWORD:?Set N8N_BASIC_AUTH_PASSWORD in .env}"
      GENERIC_TIMEZONE: "${GENERIC_TIMEZONE:-America/Sao_Paulo}"
      TZ: "${TZ:-America/Sao_Paulo}"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/.n8n/workflows:ro
    restart: unless-stopped

volumes:
  ame_data:
  n8n_data:
